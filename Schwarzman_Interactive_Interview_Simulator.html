  "application": "Biographical Profile\nSienna Sexton is a Senior Consultant at Good Faith, a UK-based social consultancy. Sienna is passionate about building coalitions to solve intractable social, political and environmental issues in the UK and Africa. With experience in activism and youth mobilisation, she is using her Parliamentary and Public Affairs experience to advice over 40 Parliamentarians on faith engagement, and has delivered 9 cohesion and peace projects with politicians, local communities in the UK and Nigerian faith leaders. She pioneered the first events supporting politicians and senior church leaders to respond to religious ethnonationalism in the UK. Sienna is from the UK.\n\nCV:\n\nVideo Script: (Filmed outside Parliament, with book, umbrella and bike)\nHi, my name’s Sienna Sexton. If my nose isn’t in a book, I’m probably turning something old into something new, learning a new skill, or cycling somewhere that’s almost definitely raining.\nI’m also probably thinking about two questions.\nIn a world that’s increasingly divided, from our local to our global neighbourhoods, with alliances fracturing and realigning, breakneck technological change, unfettered competition, and eroding trust in democracy and institutions, how can we turn back the tide of fragmentation to build surprising coalitions, rebuild trust and relationships, and work together to tackle some of the big issues we’re facing today; from climate change and migration to democratic backsliding amongst the exacerbating force that is AI?\nAnd, more importantly, what can each of us do within our own sphere of influence to help make this happen?\nMy name’s Sienna. I ask big questions, and I’m ambitious about working on solutions together. To turn ideas into action.\nInterests\nSelect two interests that best identify with your professional and leadership aspirations:\n* Arts and Culture\n* Business\n* Communications\n* Consulting\n* Economics/Economic Policy\n* Education\n* Energy\n* Entrepreneurship\n* Environment/Climate\n* Finance\n* Foreign Policy\n* Government\n* Health/Health Care\n* Law\n* Media\n* Public/Social Policy\n* Science\n* Technology\n\nLanguages:\nEnglish (Native)\nFrench (Advanced proficiency)\nNorwegian (Beginner)\n\nReferences\nDr James Wood, Trinity Hall (At least one letter should be written by (preferably) a professor or other appropriate recommender who can speak directly to the applicant’s academic abilities.)\nMr Dilwar Hussain OBE, Researcher Woolf Institute, Ex-Social Cohesion Special Advisor PM Keir Starmer (One letter must address a candidate’s demonstrated leadership abilities and potential while using specific examples. This can be submitted by an employer, supervisor, mentor, faculty member, or other appropriate recommender.)\nDr Austin Tiffany, Good Faith Partnership (The third letter may be written by a recommender (e.g., an employer or mentor) who can offer further insight into the applicant’s current profile — provide another comment on leadership abilities, serve as an additional academic endorsement, or a combination of the above options. )\n\n\nLeadership Experience\nThis section is an opportunity to showcase up to five leadership roles that illustrate your demonstrated leadership experience. For each entry, include a concise explanation of why the role is significant to your leadership profile, as well as your distinct contribution, outcome, or initiative.\n* Nigerian Peace Summit, Forum For Peace: I was political liaison with the US, UK, and Nigeria at a convening of Nigerian Christians and Muslims developing a framework for action and theology for faith leaders in conflict zones. After communication between Directors and the delivery team broke down, I organised a meeting with a Director, making recommendations on restructuring team meetings and communication. These were adopted, and communication began to improve, teaching me how to constructively challenge senior leaders in crisis moments.\n* Muslim World League Social Cohesion Hackathons: I led a social cohesion project in the most diverse community in the UK. Cohesion is built on trust and relationships, and we were an external organisation with neither. Therefore, I developed a project and culture of non-negotiable transparency, collaboration and participant-led solutions. Working with universities, politicians, parents and 20+ charities, they designed a project that is being implemented in 20 primary schools. This taught me the importance of leadership in setting cultures and direction.\n* Faith in Labour: As Project Manager, I lead a hybrid team of graduates and senior Labour Party members, including Government Ministers and Political Advisors. I oversee strategy, fundraising, delivery and team management in a fast-paced political environment. Managing this team has strengthened my ability to manage up and develop a developmental leadership style. I identify team members’ strengths and goals, set stretching responsibilities, and provide regular coaching and support.\n* External Affairs Co-President, Just Love Cambridge: During university, I co-led six students at the pandemic outbreak, navigating shared leadership, remote management and the shift online while seeking to retain local impact. I led the team to move our events programming online. With our conventional format, we initially saw a considerable drop in attendance, but the online format enabled us to host speakers from across the UK, the US, and Singapore, attracting a national audience and enabling an expanded portfolio of 24 events. Consolidating \n* Founder and President, The Switch Ethical Banking Campaign: In 2019, I founded and developed a student campaign helping students and universities make financial decisions aligned with climate concerns and human rights. I led a small team for two years, delivering six UK campaigns and supporting one university to fully divest from fossil fuels. The campaign’s closure in 2022 remains my biggest leadership failure. It taught me the importance of succession planning and investing in leadership development as part of operations. \n\nProfessional Experience\n\nGood Faith Partnership\n\nSenior Consultant specialising in social cohesion, interfaith and political affairs. Experienced project manager, researcher, writer, public affairs, partnerships manager and events organiser. Delivered the 2025 Labour Party Conference Faith in Labour Reception, programme including charity CEOs, Shabana Mahmood as Justice Minister four Junior Ministers, attended by over 150 people including 35 MPs. Following last year’s success, the Labour Party has asked me to organise this year’s reception as a headline Labour Party Reception. \n\nJust Love UK \n\nSupported student activist groups in Birmingham, Nottingham and Oxford, alongside leading the alumni network and building organisational partnerships. In my first year, I coached 20+ students through 1:1 and practical support. All three groups were rebuilding after the pandemic and had lost institutional knowledge. I coached them to re-establish programmes, resulting in two new Nottingham volunteering placements, a volunteering safeguarding overhaul and 75+ student events. I also supported co-Presidents to navigate challenging team dynamics, ultimately enabling successful collaboration.\n\nLeadership Essay \nDescribe one distinct example that illustrates who you are as a leader and how you think about leadership. Normally, the most effective method one can use to convey this example is by presenting a story or narrative.\n\nAs you are drafting your leadership essay, you may draw from your professional, academic, or personal life. Some suggestions of demonstrated leadership you might choose to highlight include:\n* a time you used your intellectual abilities to identify an important challenge or opportunity, and how you crafted a solution;\n* an instance when you used your interpersonal skills to inspire a team effort towards a solution;\n* an example of when you have pushed through resistance or an obstacle to realize positive change for the community around you.\n\nThese are merely examples of how you could organize your thoughts. Do not feel like you need to focus your leadership essay in a way that addresses all or even one of the aforementioned options.\nMake sure you talk about the example in detail, highlight areas of personal growth, how you think this important example has shaped you as a leader, and why it will continue to do so in the future.\nThe most important thing you need the Admissions Committee to understand after reading this essay is a clear view of your authentic thoughts on leadership, and the style you use to accomplish your goals. How you present your ideas on leadership in this essay often tells as much as what you choose to write.\nIn 2024, my elation about the hope of a more inclusive country with the election of a left-wing Government evaporated. Asylum seeker hotels were being attacked. Many of my hijabi friends and colleagues reported everyday abuse, and others said that they were scared to leave home. The far-right was emboldened, and a new, fear and anger driven politics was taking root, driven in part by Reform UK’s rise and the normalisation of its message. \nAs a Christian, I was appalled to see how a small yet growing minority was justifying these views and actions by weaponising my faith in ways that I believed were completely antithetical to its teachings. My faith has given me a family and community with people from all walks of life and backgrounds, including refugees from across the world. The same faith that challenged me to generously love – my neighbour, strangers and even my enemy –, was being used to justify hate and violence.\nThe UK previously seemed to be immune to the Christian Nationalism found across the US and spreading across Europe. However, my political background and theological training from Just Love and JPIT made me aware of the early warning signs of Christian Nationalism and its warped theological justifications. In late 2024, I shared my concerns and observations with a variety of Parliamentarians, researchers and faith leaders. I found that while they could identify the problem, no one was acting on it. Weeks passed, the situation worsened, thought pieces were published sounding the alarm, but no one took action. I decided that we needed to do something. \nIn March 2025, I organised meetings with concerned Parliamentarians and synthesised my understanding of what I was convinced was a growing threat to society and my faith. I turned my analysis into a case which I presented to a senior leaderSenior Director,. While I did not have a fully formed solution, I and argued that to successfully face a well-funded and growing movement, we needed a space for people to share expertise, knowledge and develop solutions before it metastasised. Given Good Faith’s experience and networks across faith and politics, I believed we were well placed to convene at a moment when others seemed unable or unwilling to act. I successfully made the case for developing a Christian Nationalism workstream in April 2025, putting us at the fore of domestic responses months before most organisations began moving on the issue.\nIn the subsequent 9 months, the issues deepened while, alongside senior colleagues, I delivered a series of meetings building towards a summit of Christian leaders. At the summit, we convened 70+ Christian leaders across the diversity of Christian communities and sectors in the UK: the nations, major national denominations, political parties and major charities. We painstakingly designed a programme charting a path to action and building common ground, believing that to take power out of the Christian Nationalist movement we needed to build a broad tent. The day was designed to develop a theological case against Christian Nationalism, share intelligence on how it was impacting communities and move swiftly to the ideation phase, aiming for everyone to leave with at least one action to implement in their sphere of influence. However, as the day progressed, I had a sinking feeling – left-wing participants protested the inclusion of right-wing voices, the lack of relational depth between participants meant that moments of contention preventeddid not lead to robust discussion, and a majority of participants were caught in diagnosis paralysis and were unwilling to commit to actions, seemingly waiting for leadership elsewhere. As our funding ran out, we were unable to build on the insights gained and relationships built. \nFollowing the Summit, I reflected on why it did not achieve its ambitions. I believe that we were overambitious, expectingaiming to build common ground from scratch without allowing time for relationships to deepen intoto build genuine shared understanding, and aiming to catalyse action within large institutions and organisations without adequate resources for sustained support. These lessons have been invaluable in subsequent convenings, including the Nigerian Summit, which continues to develop and bear fruit. \nSince the Summit, the situation has worsened, with door-to-door attacks taking place in Thetford and Belfast this summer. However, it has also taught me about resilience, hope and being brave in action. Despite limited immediate results from summit participants, our relationships and work endured, leading to Good Faith becoming a core delivery partner of Million Acts of Hope, a national campaign running 1,500 community events in 2026 to counter social division.\nWord Count: 732 (if all edits are accepted; 741 if the 4th paragraph’s sentence is kept as “… senior leader. While I did not have a fully formed solution, I argued that…” ; +3 to convert JPIT to its full name)\n\n\n\nStatement of Purpose\nTell us about your professional/academic interests and goals as you see them now. Describe what particular social, cultural, business, policy, or global issue is the current focus of your motivation. Why and how did you develop an interest in this issue, and why do you think that interest might continue in the future? What are the major factors involved in this issue, and what is your leadership vision to drive positive global change?  Living in Uganda as a child, I grew up eating weekly Sunday lunches with refugees from Darfur. These friendships meant that from an early age I witnessed gross social inequality and the impact of conflict and corruption on my friends’ lives. Moving to the UK as a citizen at 11, I became even more conscious of my privilege, and yet I struggled to integrate and make friends despite having citizenship, family in the UK, being the ‘right’ colour and having the ‘right’ accent. These friendships and my personal experiences of challenges belonging even when all the odds were stacked in my favour have been a consistent motivation for volunteering with refugees since I was 15, and in my professional and academic determination to understand and respond to the drivers of polarisation and conflict. \n\nThrough my studies, work with faith-based organisations, and as a person of faith myself, I am fascinated by how ideas and beliefs can deepen polarisation and conflict or create the conditions for cooperation. At university, I studied political philosophy and specialised in the role of religion in politics. Working on a Nigerian Peace Project and on curbing Christian Nationalism amidst riots and far-right protests, I have repeatedly seen how genuine economic grievances are misdirected through the weaponisation of narratives and religion to drive fear, alienation and division. My work seeks to turn these same forces into tools that bring people together.\nThe risks are growing faster than our communities and Governments are responding, at a time when the eroded international order cannot play the vital consensus-building role we desperately need. In the UK, we are witnessing artificial intelligence inflame existing drivers of conflict and polarisations, displace jobs, replace social relationships and drive disinformation. Already, domestic and international disinformation has led to riots, violent anti-immigration protests and rampant racism on our streets. \nCrucially, feelings of dislocation are not held by marginalised communities alone but can be shared by those who, like me as a child, have structural advantages and by the violent protestors who have bought into false narratives which displace genuine grievances. Through my career, I want to build a common ground that includes asylum seekers and far-right protesters, valuing and involving both in the rooms where decisions are made on the issues that impact them. In a world where domestic challenges often have international drivers, I want to continue working on hyper-local, national and international projects, on teams that bring people together across borders.\nFor me, finding solutions to polarisation and conflict is not a theoretical nice-to-have; 21 years after I befriended Sudanese refugees, asylum seekers are being targeted in their homes in the UK, Sudan is again at war, and South Sudan is at risk of widespread conflict. I intend to dedicate my career to building relationships, infrastructure, and networks that enable people and societies to overcome conflict, so that peace, cohesion, and prosperity become the norm, and so that in another 21 years, Sudan and South Sudan are beacons of stability and multi-faith government.\n(500)!!\nShort Answer Questions\n 1. How do you see spending a year at Schwarzman College in Beijing and joining the Schwarzman Scholars network for life advancing your specific leadership goals and future impact?\nIn my work, I am increasingly aware of my gaps in economics and in a rigorous understanding of how AI and geopolitics intensify polarisation and drive conflict. This is hindering my ability to create future-proof projects that build belonging across the country. I intend to use my time at Schwarzman to fill these gaps and, through the Deep Dive, to gain insights and lessons on how Chinese citizens navigate social and community relationships, and national identity in the presence of omnipresent technology. Returning to the UK, I will use learning from the course and cohort to build cohesion infrastructure, working with national government and civil society to build technologically literate, citizen-led forms of deliberation that put people at the heart of cohesion policy. (123)\n\nIn my work, I am increasingly aware of gaps in my understanding of how economics, AI and geopolitics intensify polarisation and drive conflict. This limits my ability to design cohesion initiatives that last. I will use my time at Schwarzman to fill these gaps – the Deep Dive will give me insights and lessons on how Chinese citizens navigate belonging and national identity in the presence of omnipresent technology. After returning to the UK, I will use these learnings to build cohesion infrastructure with government and civil society – technologically literate, citizen-led deliberation that puts people at the heart of policy.\n\n(99 after strikethrough)\n\n2. Tell us something about yourself the Admissions Committee would not otherwise know based on the other parts of this application.\nSince my 23rd birthday, I have challenged myself to read at least as many books each year as I am years old. I wanted a stretching goal to read across genres and global perspectives, because I believe that to listen is to learn. As part of this, I have actively participated in an international peacebuilding and development book club for the past three years, reading widely on topics ranging from Africanist political theology, Martin Luther King Junior’s sermons, and the development of international human rights law.\n\n\n",

function homeView(){const done=DATA.checklist.filter((x,i)=>state.checklist[i]).length;const rated=state.history.filter(s=>scCount(s.score3)>0);const avg=rated.length?(rated.reduce((a,s)=>a+scoreTotal(s.score3)/scCount(s.score3),0)/rated.length).toFixed(1):'—';return `<div class="hero"><p class="eyebrow">THE FINAL PANEL / INTERACTIVE WORKSPACE</p><h1>Lead with substance.<br><em style="font-weight:400;color:#d6b689">Defend your thinking.</em></h1><p>A private, application-led practice studio for Sienna Sexton. Train on documented leadership choices, rigorous follow-ups, China fit and the unexpected final five minutes.</p><div class="hero-actions">${btn('Start a 25-minute panel →','gotoSim','gold')}${btn('Open question bank','gotoBank','ghost')}${btn('Run targeted drills','gotoDrills','ghost')}</div></div><div class="kpis"><div class="kpi"><span class="tag">Merged interview questions</span><div class="n">${DATA.questions.length}</div><div class="tag">From three guides + application</div></div><div class="kpi"><span class="tag">Completed sessions</span><div class="n">${state.history.length}</div><div class="tag">Stored on this device</div></div><div class="kpi"><span class="tag">Average pillar score</span><div class="n">${avg}${avg!=='—'?'<span style="font-size:16px"> / 5</span>':''}</div><div class="tag">Rated sessions only</div></div><div class="kpi"><span class="tag">Preparation checklist</span><div class="n">${done}<span style="font-size:16px"> / ${DATA.checklist.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(done/DATA.checklist.length*100)}%"></div></div></div></div>${state.active?`<div class="notice">You have an unfinished ${e(state.active.mode)} session (${pad(getElapsed(state.active))} elapsed). <button class="mini-action" data-action="resume">Resume it →</button></div>`:''}<div class="grid2"><div class="card"><p class="eyebrow">THE INTERVIEW</p><h3>25 minutes. A real clock.</h3><p>First minute: personal introduction. Next 19: application and leadership scrutiny. Final five: an unfamiliar global issue. The simulator can enforce the transitions while you focus on asking and answering.</p><div class="tools">${btn('Launch timed panel','gotoSim','primary')}</div></div><div class="card"><p class="eyebrow">APPLICATION-SPECIFIC</p><h3>Challenge the underlying claims.</h3><p>Scrutinize the Christian Nationalism summit, Faith in Labour, Nigerian peace work, The Switch, AI claims, cohort fit and the proposed UK cohesion infrastructure.</p><div class="tools">${btn('Explore high-priority questions','priority','outline')}</div></div></div><div class="section-header"><h2>Six high-yield pressure points</h2></div><div class="grid3">${[['Leadership vs. attendance','70+ summit participants do not establish action or impact.'],['Ethical coalition boundaries','Which disagreements belong in one room—and when is joint participation unsafe?'],['Faith and political neutrality','How can Faith in Labour coexist with credible cross-party convening?'],['Why Beijing, specifically?','What learning about Chinese social governance transfers—or does not—to the UK?'],['Measuring a cohesion pilot','Who owns decisions, what is the budget and what will prove success?'],['Africa and local agency','What would Nigerian partners say was actually theirs to decide?']].map(([h,b])=>`<div class="card"><h3>${e(h)}</h3><div class="muted-sm">${e(b)}</div></div>`).join('')}</div><p class="footer-note">This is an independently created practice tool. Reported past questions are anecdotal. The three-pillar scoring is a coaching interpretation of published selection priorities, not an official grading system. Event figures are claims from the supplied application until verified.</p>`}

iv></div><div class="stack"><div class="card"><h3>25-minute structure</h3><div class="listitem"><b>00:00–01:00</b><p>One-minute introduction (no notes).</p></div><div class="listitem"><b>01:00–20:00</b><p>Leadership, application claims, character, future strategy and China fit.</p></div><div class="listitem"><b>20:00–25:00</b><p>Unanticipated current-affairs reasoning, outside normal specialty.</p></div><div class="field-desc">The app automatically advances to the news segment and ends at 25:00.</div></div><div class="card"><h3>How to use the two views</h3><p><b>Interviewer</b> displays prompts, scoring and notes. <b>Candidate</b> presents only the main question and timing for a clean shared-screen experience. Switch at any time.</p>${btn('Preview candidate view','candidatePreview','outline')}</div></div></div>`}

div class="clock-label">ON THIS QUESTION</div><div class="digital" id="qClock">${pad(elapsed-s.qStartElapsed)}</div></div></div>${mock?`<div class="progress-track"><div class="progress-fill" id="timeBar" style="width:${Math.round(elapsed/1500*100)}%"></div></div><div class="p-stage" id="stageLabel">${mkPhase(elapsed)}</div><div class="phases"><div class="phase ${elapsed<60?'active':'over'}" style="flex:1"></div><div class="phase ${elapsed>=60&&elapsed<1200?'active':elapsed>=1200?'over':''}" style="flex:19"></div><div class="phase ${elapsed>=1200?'active':''}" style="flex:5"></div></div>`:`<div class="progress-track"><div class="progress-fill" id="timeBar" style="width:${s.mode==='drill'?Math.min(100,Math.round((elapsed-s.qStartElapsed)/s.perQuestion*100)):0}%"></div></div>`}<div class="toolbar">${btn(s.running?'Pause':'Start / resume',s.running?'pause':'play','primary')}${btn('Next question →','next','ghost',mock&&s.index===5?'disabled':'')}${btn('↺ Reset clock','resetClock','ghost')}${btn('✓ Mark answered','markAnswered','outline')}${state.seen.includes(q.id)?chip('Answered previously','blue'):''}</div><p class="tiny" style="margin:13px 0 0">${s.mode==='mock'?'The first question automatically changes at 01:00. The current-affairs question arrives at 20:00 regardless of where the discussion has reached.':'Space: pause/resume · N: next question (when not typing).'}</p></div><div class="card interviewer-only"><div class="row between"><h3>Follow-up interrogation</h3>${chip(PERSONAS[s.persona]?.title||'Panel')}</div><p class="muted-sm">${e(PERSONAS[s.persona]?.prompt||'')}</p><div id="followupArea">${renderProbes(q,s)}</div><div class="tools">${btn('Reveal next probe','reveal','outline')}${btn(s.personaAdded?'Hide persona challenge':'Add persona challenge','personaProbe',s.personaAdded?'outline':'ghost')}${s.pressure?btn('Escalate pressure','escalate','gold'):''}</div></div></div><div class="stack interviewer-only"><div class="card sticky-mini"><h3>Interviewer notes and function renderProbes(q,s){
 const persona=PERSONAS[s.persona];

 return challenge+revealed||`<div class="empty">Probes hidden. Let the candidate complete the first answer before revealing them.</div>`;

function newSession(mode,queue,more){return {id:'S'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36),mode,created:new Date().toISOString(),completed:null,persona:more.persona||'thoughtful',pressure:!!more.pressure,script:more.script||'',drillType:more.drillType||'',queue:queue.slice(),index:0,notes:{},qScores:{},score3:{},score6:{},debrief:'',mark:[],running:false,elapsed:0,startedAt:null,qStartElapsed:0,revealed:0,personaAdded:false,perQuestion:more.perQuestion||0,lastTimedIndex:0,autoAdvance:more.autoAdvance!==false};}

function drillQueue(type){let all=DATA.questions;let cats,limit,duration;if(type==='intro')return {queue:shuffle(all.filter(q=>q.category==='Opening & narrative')).slice(0,5).map(q=>q.id),perQuestion:60};if(type==='rapid')return {queue:shuffle(all.filter(q=>q.category!=='Current affairs')).slice(0,10).map(q=>q.id),perQuestion:75};if(type==='affairs')return {queue:shuffle(all.filter(q=>q.category==='Current affairs')).slice(0,5).map(q=>q.id),perQuestion:300};if(type==='china')cats=['China & Schwarzman'];else if(type==='evidence')cats=['Leadership & impact','Evidence & measurement'];else if(type==='policy')cats=['Cohesion policy design','Goals & strategy'];else if(type==='coalition')cats=['Cohesion & coalition ethics','Politics & faith'];else if(type==='africa')cats=['Nigeria & Africa','International development'];else cats=['Leadership & impact','Cohesion & coalition ethics','China & Schwarzman'];let pool=shuffle(all.filter(q=>cats.includes(q.category)&&q.sources.some(s=>s.includes('tailored')||s.includes('Application'))));let n=type==='pressure'?8:7;return {queue:pool.slice(0,n).map(q=>q.id),perQuestion:type==='pressure'?150:180}}

 }else if(s.mode==='drill'&&s.autoAdvance){if(elapsed-s.qStartElapsed>=s.perQuestion){if(s.index<s.queue.length-1){syncIndex(s,s.index+1);changed=true;notify('Time · moving to next drill question')}else{pause();notify('Drill complete. End and save your evaluation.')}}}
 if(changed)render();else refreshClock();if(elapsed%5===0)save();}
function refreshClock(){const s=state.active;if(!s)return;let el=getElapsed(s),remain=s.mode==='mock'?Math.max(0,1500-el):s.mode==='drill'?Math.max(0,s.perQuestion-(el-s.qStartElapsed)):el;let v=$('#mainClock');if(v){v.textContent=pad(remain);v.classList.toggle('warning',s.mode!=='practice'&&remain<=60)}let q=$('#qClock');if(q)q.textContent=pad(el-s.qStartElapsed);let bar=$('#timeBar');if(bar)bar.style.width=(s.mode==='mock'?Math.round(el/1500*100):s.mode==='drill'?Math.min(100,Math.round((el-s.qStartElapsed)/s.perQuestion*100)):0)+'%';let stage=$('#stageLabel');if(stage)stage.textContent=mkPhase(el)}
function finishSession(reason='Ended by interviewer'){let s=state.active;if(!s)return;s.elapsed=getElapsed(s);s.running=false;s.startedAt=null;s.completed=new Date().toISOString();s.finishReason=reason;if(!state.history.some(x=>x.id===s.id))state.history.unshift(structuredClone(s));state.active=null;state.page='history';save();render();notify('Session saved · review and export your debrief')}
function scoreHandler(btn){let s=state.active;if(!s)return;const k=btn.dataset.key,n=Number(btn.dataset.score),c=btn.dataset.context;let map=c==='question'?s.qScores:c==='pillar'?s.score3:s.score6;if(!map)return;map[k]=map[k]===n?undefined:n;if(map[k]===undefined)delete map[k];render()}
function drillsList(){return [['coalition','Coalition boundaries','Distinguish disagreement from harm; tackle far-right participation and safeguarding.'],['evidence','Evidence and attribution','Separate impressive activity counts from outcomes and personal impact.'],['china','Why China / Tsinghua','Test uniqueness of the year abroad, curriculum fit and transferability.'],['policy','Build a cohesion pilot','Design governance, resources, success metrics and stopping criteria.'],['africa','Nigeria & global development','Probe local ownership, cross-cultural judgment and Sudan strategy.'],['pressure','Senior-panel pressure test','Difficult applications questions, quick follow-ups and evidence challenges.'],['rapid','Rapid-fire 10','Ten different 75-second questions without lengthy preparation.'],['intro','One-minute introduction','Five variants of the 60-second personal opening.'],['affairs','Five-minute news gauntlet','Five unanticipated policy dilemmas, each with a five-minute limit.']]}
function drillView(){return `<div class="pagehead"><div><p class="eyebrow">TARGETED PRACTICE</p><h1 class="h-title">Drills & pressure tests</h1><p class="lead">Build fluency in weak spots without memorizing answers. Every drill is based on the source materials and application themes.</p></div></div><div class="columns-main"><div class="card"><h3>Set up a drill</h3><div class="field"><label class="label">Drill type</label><select id="drillSelect">${drillsList().map(([k,n])=>`<option value="${k}" ${k===state.settings.drillType?'selected':''}>${e(n)}</option>`).join('')}</select></div><div class="field"><label class="label">Interviewer persona</label><select id="drillPersona">${personaOptions(state.settings.drillPersona)}</select></div><label class="tick"><input type="checkbox" id="drillPressure" ${state.settings.drillPressure?'checked':''}><span class="ticktext"><b>Add pressure-test follow-ups</b><small>Extra skepticism about evidence, power, ethics and execution.</small></span></label><label class="tick"><input type="checkbox" id="autoAdvance" checked><span class="ticktext"><b>Advance automatically when each question timer expires</b><small>The interviewer can always advance manually.</small></span></label><div class="tools">${btn('Start this drill →','startDrill','primary')}</div><div class="rule"></div><h3>Free practice</h3><p class="muted-sm">Prefer to choose one question at a time? Search the full question bank and tap “Practise”.</p>${btn('Browse all questions','gotoBank','ghost')}</div><div class="stack"><div class="card"><h3>Drill library</h3>${drillsList().map(([k,n,d])=>`<button data-action="chooseDrill" data-value="${k}" style="display:block;text-align:left;border:0;background:transparent;width:100%;padding:11px 0;border-bottom:1px solid var(--hair)"><b style="font-size:12px;color:#254d45">${e(n)}</b><div class="muted-sm">${e(d)}</div></button>`).join('')}</div><div class="card"><h3>Follow-up technique</h3><p>Listen without interrupting the first answer. Then ask what was personally decided, what evidence supports the outcome, who disagreed, and what would change the candidate's mind. After the strongest answer, pivot to an unexpected angle.</p></div></div></div>`}
function bankView(){const f=state.bank;let pool=DATA.questions.filter(q=>{if(f.search&&!(`${q.q} ${q.context} ${q.category} ${q.sources.join(' ')}`.toLowerCase().includes(f.search.toLowerCase())))return false;if(f.category!=='all'&&q.category!==f.category)return false;if(f.source==='reported'&&!q.reported)return false;if(f.source!=='all'&&f.source!=='reported'&&!q.sources.includes(f.source))return false;if(f.difficulty!=='all'&&q.level!==Number(f.difficulty))return false;if(f.starred&&!state.favorites.includes(q.id))return false;return true});return `<div class="pagehead"><div><p class="eyebrow">ALL SOURCE MATERIAL</p><h1 class="h-title">Question bank</h1><p class="lead">${DATA.questions.length} unique practice prompts merged from the three guides and Sienna's application, including questions from all six timed scripts. Source labels distinguish reported recollections from invented practice.</p></div><div class="row">${btn('Random question','randomQuestion','primary')}${btn('Add fresh-news prompt','customNews','ghost')}${btn('Starred only','starFilter','ghost')}</div></div><div class="filters"><div><label>Search questions</label><input id="bankSearch" placeholder="Search summit, China, outcomes, AI…" value="${e(f.search)}"></div><div><label>Topic</label><select id="bankCategory"><option value="all">All topics</option>${CATS.map(x=>`<option ${f.category===x?'selected':''} value="${e(x)}">${e(x)}</option>`).join('')}</select></div><div><label>Source</label><select id="bankSource"><option value="all">All sources</option>${DATA.sources.map(x=>`<option value="${e(x.id)}" ${f.source===x.id?'selected':''}>${e(x.id)}</option>`).join('')}<option value="reported" ${f.source==='reported'?'selected':''}>Reported interviews only</option></select></div><div><label>Difficulty</label><select id="bankDifficulty"><option value="all">Any level</option><option value="1" ${f.difficulty==='1'?'selected':''}>Introductory</option><option value="2" ${f.difficulty==='2'?'selected':''}>Standard</option><option value="3" ${f.difficulty==='3'?'selected':''}>Challenging</option></select></div></div><div class="row between" style="margin:12px 0 16px"><span class="muted-sm">Showing <b>${pool.length}</b> questions. ${state.favorites.length} starred.</span>${btn('Reset filters','clearBank','ghost')}</div>${pool.length?`<div class="qa-list" id="bankResults">${pool.slice(0,state.bankLimit).map(makeQuestionCard).join('')}</div>${pool.length>state.bankLimit?`<div style="text-align:center;padding:22px"><span class="muted-sm">Displaying ${state.bankLimit} of ${pool.length} results.</span><div style="margin-top:10px">${btn('Load more questions','moreBank','outline')}</div></div>`:''}`:'<div class="empty">No matching questions. Try another topic or clear the filters.</div>'}`}
function historyView(){let h=state.history;let rated=h.filter(s=>scCount(s.score3)>0),avg=rated.length?(rated.reduce((a,s)=>a+scoreTotal(s.score3)/scCount(s.score3),0)/rated.length).toFixed(1):'—';return `<div class="pagehead"><div><p class="eyebrow">DEBRIEF & LEARNING</p><h1 class="h-title">Performance over time</h1><p class="lead">A local record of completed sessions, quantitative ratings and notes. Export a session as CSV, print to PDF or back up everything as JSON.</p></div><div class="row">${btn('Export full backup','exportJSON','ghost')}${btn('Import backup','importJSON','ghost')}</div></div><div class="kpis"><div class="kpi"><span class="tag">Sessions completed</span><div class="n">${h.length}</div></div><div class="kpi"><span class="tag">Pillar mean</span><div class="n">${avg}</div></div><div class="kpi"><span class="tag">Questions marked answered</span><div class="n">${state.seen.length}</div></div><div class="kpi"><span class="tag">Questions starred</span><div class="n">${state.favorites.length}</div></div></div><div class="grid2"><div class="card"><h3>Selection pillars · average across rated sessions</h3>${THREE.map(([k])=>{let entries=h.map(s=>s.score3?.[k]).filter(Number.isFinite),val=entries.length?entries.reduce((a,b)=>a+b)/entries.length:0;return `<div class="statbar"><span style="width:95px;font-size:12px">${k}</span><div class="bar"><div style="width:${val/5*100}%"></div></div><b>${entries.length?val.toFixed(1):'—'}</b></div>`}).join('')}<p class="tiny">These scores are interviewer assessments, not official Schwarzman scores.</p></div><div class="card"><h3>What progress measures</h3><p>A score of 1 indicates an unsupported or evasive answer; 3 signals a defensible but incomplete answer; 5 reflects a precise, evidence-rich and nuanced response under pressure.</p><p>Compare recurring weak dimensions and assess whether she can replace generalized commitments with decisions, trade-offs and independently verified outcomes.</p></div></div><div class="section-header"><h2>Session history</h2><span class="muted-sm">Newest first</span></div>${!h.length?`<div class="empty">No completed sessions yet. Begin a timed mock or drill to populate this dashboard.</div>`:h.map((s,i)=>`<div class="card" style="margin-bottom:13px"><div class="row between"><div><b style="font-size:15px">${s.mode==='mock'?'25-minute mock':s.mode==='drill'?'Focused drill':'Free practice'} · ${e(s.script||s.drillType||'Question practice')}</b><div class="tiny">${dateLong(s.completed)} · ${e(PERSONAS[s.persona]?.title||'Panel')} · ${pad(s.elapsed)}</div></div><div class="row">${chip(`${scoreTotal(s.score3)}/${3*5} pillar points`,scCount(s.score3)===3?'':'amber')}${btn('View report','report','primary',`data-id="${s.id}"`)}</div></div><div class="muted-sm" style="margin-top:11px">${e(s.debrief?.trim().slice(0,185)||s.finishReason||'Session saved for debrief.')}</div><div class="tools">${btn('CSV','csv','ghost',`data-id="${s.id}"`)}${btn('Print / PDF','pdf','ghost',`data-id="${s.id}"`)}${btn('Delete','deleteSession','ghost',`data-id="${s.id}"`)}</div></div>`).join('')}<div class="callout warning"><strong>Local storage notice</strong>Notes and practice history remain in this browser profile when local storage is available. Export a JSON backup regularly. Using another computer, browser profile, or private window will not automatically transfer your progress.</div>`}
function reportView(s){return `<div class="pagehead"><div><p class="eyebrow">AFTER-ACTION REPORT</p><h1 class="h-title">${e(s.mode==='mock'?'Mock panel':s.mode==='drill'?'Drill':'Free practice')} · ${e(s.script||s.drillType||'Ad hoc')}</h1><p class="lead">${dateLong(s.completed||s.created)} · ${e(PERSONAS[s.persona]?.title||'Panel')} · ${pad(s.elapsed)} completed</p></div><div class="row">${btn('← History','goHistory','ghost')}${btn('CSV','csv','ghost',`data-id="${s.id}"`)}${btn('Print / PDF','pdf','primary',`data-id="${s.id}"`)}</div></div><div class="grid2"><div class="card"><h3>Selection pillars · ${scoreTotal(s.score3)} / 15 ${scCount(s.score3)<3?'(incomplete)':''}</h3>${THREE.map(([k,d])=>`<div class="score-row"><b>${k}</b><span class="muted-sm">${e(d)}</span><strong style="float:right">${s.score3[k]??'—'} / 5</strong></div>`).join('')}</div><div class="card"><h3>Detailed coaching · ${scoreTotal(s.score6)} / 30 ${scCount(s.score6)<6?'(incomplete)':''}</h3>${SIX.map(([k])=>`<div class="score-row"><b>${e(k)}</b><strong style="float:right">${s.score6[k]??'—'} / 5</strong></div>`).join('')}</div></div><div class="card" style="margin-top:16px"><label class="label">Debrief · biggest strengths, unresolved gaps and next practice priority</label><textarea id="debriefField" data-id="${s.id}" placeholder="One leadership example to strengthen; one story to shorten; one news topic to research; the next mock's focus.">${e(s.debrief||'')}</textarea></div><div class="section-header"><h2>Question-by-question review</h2></div>${s.queue.map((id,i)=>{let q=qmap.get(id);return `<div class="card" style="margin:0 0 11px"><div class="row between">${chip(q?.category||'Question')}<span class="tiny">#${i+1} · ${e(q?.sources.join(' · ')||'')}</span></div><h3 style="font-family:Georgia,serif;font-size:19px;font-weight:500;line-height:1.4;margin:13px 0">${e(q?.q||id)}</h3><div class="tiny">Question score: ${s.qScores[id]??'Not rated'} / 5</div><div class="muted-sm" style="white-space:pre-wrap;margin-top:11px">${e(s.notes[id]||'No interviewer notes saved.')}</div></div>`}).join('')}`}
function checklistView(){let done=DATA.checklist.filter((x,i)=>state.checklist[i]).length;let categories=[...new Set(DATA.checklist.map(x=>x[1]))];return `<div class="pagehead"><div><p class="eyebrow">FINAL-WEEK READINESS</p><h1 class="h-title">Preparation checklist</h1><p class="lead">Combine the procedural recommendations from the drill guide with Sienna-specific claim verification and policy preparation.</p></div></div><div class="card"><div class="row between"><b>${done} of ${DATA.checklist.length} completed</b>${chip(Math.round(done/DATA.checklist.length*100)+'% complete')}</div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(done/DATA.checklist.length*100)}%"></div></div><div class="tools">${btn('Mark all incomplete','clearChecklist','ghost')}</div></div>${categories.map(cat=>`<div class="section-header"><h2>${e(cat)}</h2></div><div class="card">${DATA.checklist.map((item,i)=>item[1]===cat?`<label class="tick ${state.checklist[i]?'done':''}"><input type="checkbox" data-action="check" data-index="${i}" ${state.checklist[i]?'checked':''}><span class="ticktext">${e(item[0])}<small>${e(item[2])}</small></span></label>`:'').join('')}</div>`).join('')}`}
function dossierView(){let tab=state.guideTab;return `<div class="pagehead"><div><p class="eyebrow">SOURCE MATERIAL & APPLICATION CONTEXT</p><h1 class="h-title">Dossier & interview guidance</h1><p class="lead">All source material informs the questions. This view holds important original claims, question provenance, procedural notes and private application text for interviewer reference.</p></div></div><div class="tabs">${[['evidence','Claims to verify'],['format','Format & coaching'],['sources','Sources & provenance'],['application','Application text']].map(([k,v])=>`<button data-action="guideTab" data-value="${k}" class="${tab===k?'active':''}">${v}</button>`).join('')}</div>${tab==='evidence'?`<div class="card"><h3>Claims and audit questions</h3><p>These figures appear in supplied applicant materials. Do not convert attendance or planned activities into verified outcomes.</p><table class="table"><thead><tr><th>Application claim</th><th>What a panelist should investigate</th></tr></thead><tbody>${DATA.claims.map(([a,b])=>`<tr><td>${e(a)}</td><td>${e(b)}</td></tr>`).join('')}</tbody></table></div><div class="card section-gap"><h3>Application tensions worth probing</h3>${[['Summit ambition vs. result','Leadership essay describes inadequate relationship depth, diagnosis paralysis and insufficient follow-through resources.'],['Political coalition vs. party links','Faith in Labour experience provides access but raises credible questions about cross-party perception.'],['Inclusive dialogue vs. asymmetric threat','Distinguish enabling pluralism from forcing vulnerable people into unsafe encounters.'],['China inquiry vs. UK institutional transfer','Specify what to learn, what not to emulate and how to test assumptions.'],['Technology and polarization','Ask for a causal argument, competing explanations and evidence that would reverse the claim.'],['Locally led African partnerships','Clarify local agency and UK adviser boundaries.']].map(([a,b])=>`<div class="listitem"><h4>${e(a)}</h4><p>${e(b)}</p></div>`).join('')}</div>`:tab==='format'?`<div class="grid2"><div class="card"><h3>Officially described panel procedure</h3><p>Typically 5–6 senior interviewers. About one minute for a concise introduction; application-led questioning until minute 20; one randomly selected current-affairs question outside the applicant's specialty; 25-minute hard stop. Source: official Schwarzman FAQ as cited in the supplied guides.</p><div class="callout"><strong>Selection focus</strong>Leadership · Intellect · Character. The scorecards in this application are practice instruments, not official scoring weights.</div></div><div class="card"><h3>Five-minute news-answer framework</h3><p>Identify the stakes and affected parties; map competing interests; take a provisional stance; consider the strongest opposing argument; specify evidence that could change your view and the next thing to watch.</p><p>Unknown facts should be acknowledged rather than invented. The attached guide's news snapshot is dated 12 October 2026 and must be refreshed independently ahead of the interview.</p></div><div class="card"><h3>Flexible response structures</h3>${[['Leadership','Situation → personal decision → mobilized stakeholders → results and limits → adjustment.'],['Ethics','Conflicting values → red lines → affected communities → decision → acknowledged costs.'],['China fit','Learning gap → specific program experience → research question → UK application.'],['Evidence','Known → inferred → not yet measured → verification needed.']].map(([a,b])=>`<div class="listitem"><h4>${a}</h4><p>${e(b)}</p></div>`).join('')}</div><div class="card"><h3>Interviewer conduct</h3><p>Read the application before the mock. Keep the clock, interrupt only purposefully, ask multiple layers of substantive follow-ups, and vary the persona. The original guide recommends several full rehearsals and reviewing a recorded mock.</p><p>Be demanding without becoming personally hostile. Reward honest adjustments and realistic trade-offs over effortless-sounding certainty.</p></div></div>`:tab==='sources'?`<div class="card"><h3>Content sources</h3>${DATA.sources.map(s=>`<div class="resource"><strong>${e(s.title)}</strong><div class="muted-sm">${e(s.detail)}</div><small>${e(s.ref)}</small></div>`).join('')}<div class="rule"></div><h3>Interpretation key</h3><p>“Reported · unverified” indicates a self-described past applicant's anecdotal account. Other questions are training prompts written in the source guides or developed from the application. No committee questions for Sienna are known.</p><p>News questions marked as dated are adapted from the 12 October 2026 attached guide; their event descriptions have not been independently re-verified for this offline app.</p><p>Reference: <a href="https://www.schwarzmanscholars.org/frequently-asked-questions/" target="_blank" rel="noopener noreferrer">Schwarzman Scholars FAQ ↗</a> (only if internet is available).</p></div>`:`<div class="card"><div class="row between"><h3>Supplied biography and application</h3>${chip('Private · stored within this HTML','red')}</div><p class="muted-sm">This is the verbatim supplied text for interviewer reference. It includes visible draft and alternative wording; confirm the final submitted version before quoting it back to the candidate. Do not share this HTML publicly without her permission.</p><details><summary style="cursor:pointer;font-weight:750;margin:12px 0">Expand full application text</summary><div class="pre">${e(DATA.application)}</div></details></div>`}`}
function buildPrint(s){let arr=[];arr.push(`<h1>Schwarzman Scholars · Interview debrief</h1><p class="print-meta">Sienna Sexton · ${e(s.mode)} · ${e(s.script||s.drillType||'Practice')} · ${e(dateLong(s.completed||s.created))} · ${pad(s.elapsed)} elapsed</p><p><b>Interviewer:</b> ${e(PERSONAS[s.persona]?.title||'Panel')} &nbsp; <b>Pressure-test:</b> ${s.pressure?'On':'Off'}</p><h2>Selection pillars (${scoreTotal(s.score3)}/15; ${scCount(s.score3)}/3 rated)</h2>`);for(let [k] of THREE)arr.push(`<p>${e(k)}: <b>${s.score3[k]??'—'}/5</b></p>`);arr.push(`<h2>Detailed coaching (${scoreTotal(s.score6)}/30; ${scCount(s.score6)}/6 rated)</h2>`);for(let [k] of SIX)arr.push(`<p>${e(k)}: <b>${s.score6[k]??'—'}/5</b></p>`);arr.push(`<h2>Debrief</h2><p>${e(s.debrief||'No debrief recorded.')}</p><h2>Question-by-question</h2>`);s.queue.forEach((id,i)=>{let q=qmap.get(id);arr.push(`<div class="print-row"><h3>${i+1}. ${e(q?.q||id)}</h3><p class="print-meta">${e(q?.category||'')} · ${e(q?.sources.join(', ')||'')} · Score ${s.qScores[id]??'—'}/5</p><p style="white-space:pre-wrap">${e(s.notes[id]||'No notes')}</p></div>`)});return arr.join('')}
function findSession(id){return state.history.find(s=>s.id===id)||state.active}

function download(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function csv(id){let s=findSession(id);if(!s)return;let rows=[['Session ID','Date','Mode','Persona','Question ID','Category','Question','Source','Question score','Notes']];s.queue.forEach(qid=>{let q=qmap.get(qid);rows.push([s.id,s.completed||s.created,s.mode,PERSONAS[s.persona]?.title||s.persona,qid,q?.category,q?.q,q?.sources.join(';'),s.qScores[qid]??'',s.notes[qid]||''])});rows.push([]);THREE.forEach(([k])=>rows.push(['Pillar score',k,s.score3[k]??'']));SIX.forEach(([k])=>rows.push(['Detailed score',k,s.score6[k]??'']));rows.push(['Debrief',s.debrief||'']);download(`Schwarzman_session_${s.id}.csv`,rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function exportJSON(){download('Schwarzman_Studio_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'schwarzman-studio-v2',history:state.history,active:state.active?{...state.active,running:false,elapsed:getElapsed(state.active)}:null,favorites:state.favorites,seen:state.seen,customQuestions:state.customQuestions,checklist:state.checklist,settings:state.settings},null,2),'application/json')}
function importJSON(file){if(!file)return;file.text().then(v=>{const x=JSON.parse(v);if(x.format!=='schwarzman-studio-v2'||!Array.isArray(x.history))throw Error('This is not a Schwarzman Studio backup.');if(!confirm(`Import ${x.history.length} session(s)? Existing sessions with the same ID will be kept.`))return;let known=new Set(state.history.map(s=>s.id));for(let row of x.history){if(row&&typeof row.id==='string'&&Array.isArray(row.queue)&&!known.has(row.id)){state.history.push(row);known.add(row.id)}}if(x.checklist&&typeof x.checklist==='object')state.checklist={...state.checklist,...x.checklist};if(Array.isArray(x.customQuestions))for(const q of x.customQuestions){if(q&&typeof q.id==='string'&&typeof q.q==='string'&&q.id.startsWith('CUSTOM_')&&!qmap.has(q.id)){state.customQuestions.push(q);DATA.questions.push(q);qmap.set(q.id,q)}}if(Array.isArray(x.favorites))state.favorites=[...new Set([...state.favorites,...x.favorites])].filter(k=>qmap.has(k));if(Array.isArray(x.seen))state.seen=[...new Set([...state.seen,...x.seen])].filter(k=>qmap.has(k));save();render();notify('Backup imported successfully')}).catch(err=>notify('Unable to import backup: '+err.message))}
function promptNewsExtra(){let text=prompt('Type a verified, up-to-date current-affairs practice question (the app does not retrieve headlines itself):');if(!text?.trim())return;let id='CUSTOM_'+Date.now();let q={id,q:text.trim().slice(0,600),category:'Current affairs',sources:['Custom prompt'],followups:[],tags:['outside-specialty'],level:2,reported:false,priority:false,context:'User-added. Verify the news context independently.'};qmap.set(id,q);DATA.questions.push(q);state.customQuestions.push(q);save();render();notify('Fresh-news question saved to this browser and future JSON backups.')}
function renderOneReport(id){let s=findSession(id);if(!s)return;$('#content').innerHTML=reportView(s);$('#topTitle').textContent='Session report';state.page='history';state.reportId=id;save()}
function handleAction(target){const a=target.dataset.action;const val=target.dataset.value;let s=state.active;switch(a){case 'nav':navigate(val);break;case 'view':state.view=val;render();break;case 'gotoSim':navigate('sim');break;case 'gotoBank':navigate('bank');break;case 'gotoDrills':navigate('drills');break;case 'priority':state.bank={...base.bank,source:'Sienna tailored pack',difficulty:'3'};navigate('bank');break;case 'resume':navigate('sim');break;case 'candidatePreview':state.view='candidate';render();break;case 'startMock':startMock();break;case 'startDrill':startDrill();break;case 'chooseDrill':state.settings.drillType=val;render();break;case 'play':play();break;case 'pause':pause();break;case 'resetClock':if(confirm('Reset the current session clock and question position?'))resetClock();break;case 'next':nextQuestion();break;case 'jump':if(s){let i=Number(target.dataset.index);if(s.mode==='mock'&&i===5&&getElapsed(s)<1200){notify('The news question is reserved for minute 20.');return}syncIndex(s,i);render()}break;case 'markAnswered':if(s){let id=s.queue[s.index];if(!state.seen.includes(id))state.seen.push(id);notify('Marked as answered');render()}break;case 'finish':if(confirm('Finish this session and save the notes and ratings?'))finishSession();break;case 'score':scoreHandler(target);break;case 'reveal':if(s){s.revealed=Math.min(allProbes(getQ(s),s).length,s.revealed+1);render()}break;case 'personaProbe':if(s){s.personaAdded=!s.personaAdded;render()}break;case 'escalate':if(s){s.pressure=true;s.revealed=Math.min(allProbes(getQ(s),s).length,Math.max(s.revealed+1,3));render()}break;case 'star':{let id=target.dataset.qid;if(state.favorites.includes(id))state.favorites=state.favorites.filter(v=>v!==id);else state.favorites.push(id);render();break}case 'oneq':startQuestion(target.dataset.qid);break;case 'randomQuestion':{let pool=DATA.questions.filter(q=>(state.bank.category==='all'||q.category===state.bank.category)&&(state.bank.source==='all'||q.sources.includes(state.bank.source)));startQuestion(choice(pool.length?pool:DATA.questions).id);break}case 'starFilter':state.bank.starred=!state.bank.starred;render();break;case 'moreBank':state.bankLimit+=70;render();break;case 'clearBank':state.bank=structuredClone(base.bank);state.bankLimit=70;render();break;case 'guideTab':state.guideTab=val;render();break;case 'check':{let n=Number(target.dataset.index);state.checklist[n]=!state.checklist[n];render();break}case 'clearChecklist':if(confirm('Clear all checklist items?')){state.checklist={};render()}break;case 'csv':csv(target.dataset.id);break;case 'pdf':pdf(target.dataset.id);break;case 'report':renderOneReport(target.dataset.id);break;case 'goHistory':state.reportId=null;render();break;case 'exportJSON':exportJSON();break;case 'importJSON':$('#fileImport').click();break;case 'deleteSession':if(confirm('Delete this saved session? This cannot be undone.')){state.history=state.history.filter(v=>v.id!==target.dataset.id);render()}break;case 'customNews':promptNewsExtra();break;}}
document.addEventListener('click',ev=>{let t=ev.target.closest('[data-action]');if(t){if(t.tagName==='A')ev.preventDefault();handleAction(t)}});
document.addEventListener('change',ev=>{let t=ev.target;if(t.id==='scriptSelect')state.settings.script=t.value;if(t.id==='personaSelect')state.settings.persona=t.value;if(t.id==='pressureInput')state.settings.pressure=t.checked;if(t.id==='randomNewsInput')state.settings.shuffleNews=t.checked;if(t.id==='drillSelect')state.settings.drillType=t.value;if(t.id==='drillPersona')state.settings.drillPersona=t.value;if(t.id==='drillPressure')state.settings.drillPressure=t.checked;if(t.id==='bankCategory')state.bank.category=t.value;if(t.id==='bankSource')state.bank.source=t.value;if(t.id==='bankDifficulty')state.bank.difficulty=t.value;if(['bankCategory','bankSource','bankDifficulty'].includes(t.id)){state.bankLimit=70;render();}if(t.id==='fileImport'){importJSON(t.files?.[0]);t.value=''}save()});
document.addEventListener('input',ev=>{let t=ev.target;if(t.id==='qNotes'&&state.active)state.active.notes[state.active.queue[state.active.index]]=t.value;if(t.id==='debriefField'){let s=findSession(t.dataset.id);if(s)s.debrief=t.value}if(t.id==='bankSearch'){state.bank.search=t.value;state.bankLimit=70;const pos=t.selectionStart;render();const newInput=$('#bankSearch');if(newInput){newInput.focus();newInput.setSelectionRange(pos,pos)}}save()});
document.addEventListener('keydown',ev=>{let editable=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName);if(editable)return;if(ev.code==='Space'&&state.active){ev.preventDefault();state.active.running?pause():play()}if(ev.key.toLowerCase()==='n'&&state.active){ev.preventDefault();nextQuestion()}});
window.addEventListener('beforeprint',()=>{if(state.reportId){let s=findSession(state.reportId);if(s)$('#printSheet').innerHTML=buildPrint(s)}});
window.addEventListener('beforeunload',()=>{if(state.active?.running){state.active.elapsed=getElapsed(state.active);state.active.running=false}save()});
setInterval(timedTransitions,250);render();
</script></body></html>
